    <body>
        <script type="module">
            import init, {
                Weekday, 
                Combination, 
                TeamInfo,
                Teams,
            } from './pkg/teams_info.js'

            await init()

            let teams = new Teams()

            let team_id = "Team1"
            let team_size = "23"
            let first_pref = Weekday.Monday
            let second_pref = Weekday.Thursday

            let teaminfo1 = new TeamInfo(team_id, team_size, first_pref, second_pref)

            console.log(teaminfo1.toJSON())

            teams.add_team(teaminfo1)

            console.log(teams.combinations)

            team_id = "Team2"
            team_size = "18"
            first_pref = Weekday.Monday
            second_pref = Weekday.Wednesday

            let teaminfo2 = new TeamInfo(team_id, team_size, first_pref, second_pref)

            teams.add_team(teaminfo2)

            console.log(teams.combinations)

            console.log(teams.toJSON())

            let best_combination = teams.get_best_valid_combination("24")

            console.log(best_combination.toJSON())

        </script>
